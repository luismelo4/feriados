name: Verify holiday sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  verify-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Refresh external data
        run: python scripts/refresh_sources.py --fix

      - name: Run tests
        run: python -m pytest

      - name: Commit refreshed data
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "luismelo4"
            git config user.email "luismelo4@users.noreply.github.com"
            git add data/municipal_holidays.json
            git commit -m "Refresh holiday source data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No source data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel production deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "No VERCEL_DEPLOY_HOOK_URL secret configured; relying on Vercel Git integration."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
