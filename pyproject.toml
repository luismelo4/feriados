[project]
name = "pt-holidays-api"
version = "0.1.0"
description = "API para feriados nacionais, regionais e municipais de Portugal com proveniencia verificavel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "requests>=2.32,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
